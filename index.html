<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Invext</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@500..700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-column phone app (max 560px), sticky month bar on top, icon tab bar fixed at the bottom; desktop centers the same column. */
:root{
  --bg:#eaf0ec; --surface:#fbfdfc; --surface-2:#dfe7e2; --ink:#0e1a14; --ink-2:#47574f; --muted:#76857e; --line:#d3ddd7;
  --accent:#0b6a4d; --accent-ink:#ffffff; --accent-soft:#cfe8dd; --pos:#0a7338; --neg:#c23b3b; --shadow:0 10px 30px -12px rgba(14,40,28,.35);
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c6:#008300; --c7:#6250d6; --c8:#e34948; --c9:#9aa59f;
  --f-display:"Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --f-body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r:16px; --gold:#e9a90c; --warn:#a96f00;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0b110e; --surface:#141c18; --surface-2:#1e2924; --ink:#e8efeb; --ink-2:#b0bfb7; --muted:#7c8b84; --line:#26322c;
  --accent:#3ec497; --accent-ink:#04241a; --accent-soft:#15352a; --pos:#3bc672; --neg:#ef6d6d; --shadow:0 10px 30px -12px rgba(0,0,0,.7);
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#008300; --c7:#9085e9; --c8:#e66767; --c9:#66716c; --warn:#f0b429;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0b110e; --surface:#141c18; --surface-2:#1e2924; --ink:#e8efeb; --ink-2:#b0bfb7; --muted:#7c8b84; --line:#26322c;
  --accent:#3ec497; --accent-ink:#04241a; --accent-soft:#15352a; --pos:#3bc672; --neg:#ef6d6d; --shadow:0 10px 30px -12px rgba(0,0,0,.7);
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#008300; --c7:#9085e9; --c8:#e66767; --c9:#66716c; --warn:#f0b429;
  color-scheme:dark }

*{box-sizing:border-box}
.top .ib.on{color:var(--accent);background:var(--accent-soft)}
.bell{position:relative}
.badge{position:absolute;top:2px;right:2px;min-width:17px;height:17px;padding:0 4px;border-radius:99px;background:var(--neg);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;line-height:1;font-variant-numeric:tabular-nums}
@media (max-width:430px){.brand span{display:none}}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);font-weight:600;font-size:13px;white-space:nowrap}
.chip .i{width:16px;height:16px}
.chip em{font-style:normal;font-size:11.5px;opacity:.75;font-variant-numeric:tabular-nums}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.al{display:grid;grid-template-columns:38px 1fr auto;gap:12px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.al:first-child{border-top:0}
.al .ico,.wr .ico{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:color-mix(in srgb,var(--s,var(--c)) 16%,transparent);color:var(--s,var(--c))}
.al .ico .i{width:20px;height:20px}
.al .t1{font-weight:700}
.al .t2{font-size:13px;color:var(--ink-2);margin-top:2px}
.go2{display:inline-flex;align-items:center;gap:2px;margin-top:6px;font-size:12.5px;font-weight:700;color:var(--accent)}
.go2 .i{width:15px;height:15px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;font-size:11.5px;font-weight:700;white-space:nowrap;background:color-mix(in srgb,var(--s) 15%,transparent);color:var(--s)}
.pill .i{width:13px;height:13px;stroke-width:2.4}
.pj-h{display:flex;align-items:center;gap:10px;min-width:0}
.pj-h>.i{color:var(--accent)}
.pj-h .ttl{font-family:var(--f-display);font-weight:700;font-size:17px;margin-right:auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pmt{font-family:var(--f-display);font-weight:800;font-size:30px;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.wr{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:8px;margin-inline:-8px;border-radius:10px;text-align:left;width:calc(100% + 16px)}
.wr:hover{background:var(--surface-2)}
.wr .ico{width:34px;height:34px;border-radius:10px}
.wr .ico .i{width:18px;height:18px}
.wr b{font-variant-numeric:tabular-nums;white-space:nowrap}
.wr span{min-width:0}
.wr small{display:block;font-size:12px;color:var(--muted)}
.disc{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:flex-start}
.disc .i{width:16px;height:16px;margin-top:1px}
.sim{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sim .fld{min-width:0}.sim input{width:100%}
@media (max-width:480px){.sim{grid-template-columns:1fr 1fr}.sim .fld:first-child{grid-column:1/-1}}
@media (max-width:460px){.sim{grid-template-columns:1fr}}
.chkline{display:flex;align-items:center;gap:10px;font-size:14px;padding:4px 2px;cursor:pointer}
.chkline input{width:20px;height:20px;accent-color:var(--accent)}
.alert-banner{width:100%;text-align:left;cursor:pointer}
.alert-banner .i{color:var(--s)}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
button:focus-visible,input:focus-visible,select:focus-visible,label:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums}
.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 110px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding-block:12px 10px}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:-.03em;margin-right:auto}
.brand .logo{width:30px;height:30px}

/* logo + splash */
.logo{display:block;flex:none}
.logo .s1{stop-color:#07513b}
.logo .s2{stop-color:#17b383}
.logo .s1{stop-color:#0f3a2b}
.logo .s2{stop-color:#0b2a1f}
.wm{font-family:var(--f-display);text-transform:lowercase}
.wm .x{color:var(--accent)}
.logo .lg-ghost{fill:none;stroke:#ffffff;stroke-opacity:.55;stroke-width:6.5;stroke-linecap:round}
.logo .lg-up{fill:none;stroke:#3ddc97;stroke-width:6.5;stroke-linecap:round}
.logo .lg-head{fill:#3ddc97;stroke:#3ddc97;stroke-width:1.5;stroke-linejoin:round}
.logo .lg-dot{fill:#f5b82e}
.logo .lg-glow{fill:#f5b82e}
.splash{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;transition:opacity .45s ease,visibility .45s}
.splash.out{opacity:0;visibility:hidden}
.splash .logo{width:104px;height:104px;filter:drop-shadow(0 18px 28px rgba(11,106,77,.28))}
.splash h1{margin:6px 0 0;font-weight:700;font-size:46px;letter-spacing:-.05em;line-height:1}
.splash p{margin:0;color:var(--muted);font-size:14.5px}
.splash .by{position:absolute;bottom:calc(28px + env(safe-area-inset-bottom,0px));font-size:12.5px;color:var(--muted);letter-spacing:.04em}
.splash .by b{color:var(--ink-2);font-weight:600}
/* intro (~2.8s): mint seed lands → dark tile is revealed from it → ghost diagonal draws → growth stroke shoots up carrying the arrowhead →
   gold dot pops with sparks and a glow → light sweeps across → wordmark types in letter by letter, the x spins in last */
.intro{overflow:visible;animation:halo 1.2s .3s ease both,thump .5s 1.75s ease}
.intro .lg-bg,.intro .lg-dot,.intro .lg-glow,.intro .lg-seed{transform-box:fill-box;transform-origin:center}
.intro .lg-seed{fill:#3ddc97;animation:pop .45s cubic-bezier(.3,1.8,.5,1) both}
.intro .lg-bg{animation:reveal .8s .3s cubic-bezier(.7,0,.2,1) both}
.intro .lg-ghost{stroke-dasharray:1;animation:draw .55s .8s cubic-bezier(.6,0,.3,1) both}
.intro .lg-up{stroke-dasharray:1;animation:draw .6s 1.15s cubic-bezier(.5,0,.2,1) both}
.intro .lg-head{animation:shoot .6s 1.15s cubic-bezier(.5,0,.2,1) both}
.intro .lg-dot{animation:pop .4s 1.7s cubic-bezier(.3,1.8,.5,1) both}
.intro .lg-glow{opacity:0;filter:blur(2px);animation:glow .9s 1.75s ease-out forwards}
.intro .lg-spark{fill:none;stroke:#f5b82e;stroke-width:1.6;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:spark .7s 1.78s ease-out forwards}
.intro .lg-flash{animation:flash .8s 2s ease-in-out both}
.splash h1 span{display:inline-block;animation:letter .5s calc(1.45s + var(--i) * .06s) cubic-bezier(.3,1.5,.5,1) both}
.splash h1 .x{animation:xin .65s 1.8s cubic-bezier(.3,1.5,.5,1) both}
.splash p{animation:rise .6s 2.05s ease both}
.splash .by{animation:rise .6s 2.25s ease both}
.splash .logo{transition:transform .45s cubic-bezier(.5,0,.75,0)}
.splash.out .logo{transform:scale(1.18)}
@keyframes reveal{from{clip-path:circle(0% at 29% 71%)}to{clip-path:circle(110% at 29% 71%)}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes shoot{0%{transform:translate(-16.5px,16.5px);opacity:0}20%{opacity:1}100%{transform:none}}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes glow{0%{transform:scale(.2);opacity:1}100%{transform:scale(4.5);opacity:0}}
@keyframes spark{0%{stroke-dashoffset:1;opacity:1}55%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:-1;opacity:0}}
@keyframes flash{from{transform:translateX(-12px)}to{transform:translateX(86px)}}
@keyframes halo{from{filter:drop-shadow(0 0 0 rgba(11,106,77,0))}to{filter:drop-shadow(0 18px 28px rgba(11,106,77,.28))}}
@keyframes thump{50%{transform:scale(1.05)}}
@keyframes letter{from{opacity:0;transform:translateY(16px)}}
@keyframes xin{from{opacity:0;transform:rotate(-200deg) scale(.2)}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
/* reduced motion (e.g. Windows "animation effects" off): no movement, just a calm fade-in in three steps */
@media (prefers-reduced-motion:reduce){.intro *,.splash h1 span{animation:none!important}.intro .lg-glow,.intro .lg-flash,.intro .lg-spark{opacity:0}
  .intro,.splash h1,.splash p,.splash .by{animation:fadein .7s both!important}.splash h1{animation-delay:.35s!important}.splash p,.splash .by{animation-delay:.7s!important}.splash .logo{transition:none}.splash.out .logo{transform:none}}
@keyframes fadein{from{opacity:0}}
.lock{max-width:360px;margin:10vh auto 0;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.lock .logo{width:72px;height:72px}
.lock h2{margin:4px 0 0;font-family:var(--f-display);font-size:21px}
.lock form{width:100%}
.lock .go{width:100%;height:50px;border-radius:14px;font-weight:700;font-size:15px;display:flex;gap:8px;align-items:center;justify-content:center}
.lock .go .i{width:20px;height:20px}
.err{color:var(--neg);font-size:13px;min-height:18px}
.about{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:22px 16px}
.about .logo{width:64px;height:64px}
.about h3{margin:4px 0 0;font-weight:700;font-size:28px;letter-spacing:-.04em}
.about .ver{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.about .cred{margin-top:8px;padding-top:12px;border-top:1px solid var(--line);width:100%;font-size:13.5px;color:var(--ink-2)}
.about .cred small{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:2px}
.about .cred b{font-family:var(--f-display);font-size:18px;color:var(--ink);letter-spacing:-.01em}
.mnav{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.mnav .lbl{min-width:84px;text-align:center;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.ib{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:12px;color:var(--ink-2);transition:background .15s,color .15s}
.ib:hover{background:var(--surface-2);color:var(--ink)}
.mnav .ib{width:32px;height:32px;border-radius:999px}
.sync{width:34px;height:34px;color:var(--muted)}
.sync.on{color:var(--accent)}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);padding:6px 8px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:12px;color:var(--muted)}
.tab span{font-size:11px;font-weight:600;height:14px;opacity:0;transition:opacity .15s}
.tab.on{color:var(--accent)}
.tab.on span{opacity:1}
.tab.on .i{stroke-width:2.2}
.fab{position:fixed;z-index:7;right:max(16px,calc(50% - 264px));bottom:calc(84px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:20px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:var(--shadow)}
.fab .i{width:28px;height:28px;stroke-width:2.2}

/* blocks */
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.sec{display:flex;align-items:center;gap:8px;margin-top:6px}
.sec h2{font-family:var(--f-display);font-size:16px;font-weight:700;margin:0;margin-right:auto;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;color:var(--ink)}
.sec h2 .i{color:var(--muted);width:19px;height:19px}
.add{width:34px;height:34px;border-radius:11px;background:var(--accent-soft);color:var(--accent)}
.add:hover{background:var(--accent);color:var(--accent-ink)}

.hero{background:var(--accent);color:var(--accent-ink);border:0;padding:18px 18px 16px;position:relative;overflow:hidden}
.hero .k{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;opacity:.85}
.hero .big{font-family:var(--f-display);font-weight:800;font-size:clamp(34px,10vw,46px);letter-spacing:-.03em;line-height:1.05;margin-top:6px}
.hero .carry{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:13px;opacity:.92}
.hero .carry span{display:inline-flex;align-items:center;gap:5px}
.hero .carry .i{width:16px;height:16px}
.hero svg.bg{position:absolute;right:-18px;top:-18px;width:130px;height:130px;opacity:.12;stroke-width:1.2}

.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.tile .i{color:var(--muted)}
.tile b{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
@media (max-width:380px){.tiles{grid-template-columns:repeat(2,1fr)}}

.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
.row .ico{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;flex:none;background:color-mix(in srgb,var(--c,var(--c9)) 16%,transparent);color:var(--c,var(--c9))}
.row .ico .i{width:20px;height:20px}
.row .txt{flex:1;min-width:0}
.row .t1{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t2{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .v{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.row .v small{display:block;font-size:12px;font-weight:600;color:var(--muted)}
.row.click{cursor:pointer;border-radius:10px}
.row.click:hover{background:var(--surface-2)}
.pos{color:var(--pos)} .neg{color:var(--neg)}
.chk{width:32px;height:32px;border-radius:10px;border:1.5px solid var(--line);display:grid;place-items:center;color:transparent;flex:none}
.chk.on{background:var(--pos);border-color:var(--pos);color:#fff}
.chk .i{width:18px;height:18px;stroke-width:2.6}
.paid .t1{text-decoration:line-through;text-decoration-color:var(--muted)}

.cbar{display:grid;grid-template-columns:38px 1fr auto;align-items:center;gap:6px 12px;padding:7px 0}
.cbar .ico{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c)}
.cbar .ico .i{width:20px;height:20px}
.cbar .track{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.cbar .fill{height:100%;border-radius:99px;background:var(--c)}
.cbar .v{font-weight:700;font-variant-numeric:tabular-nums;font-size:14px}
.cbar .nm{font-size:12.5px;color:var(--ink-2);margin-bottom:4px;display:flex;justify-content:space-between;gap:8px}

.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px}
.seg button{display:flex;align-items:center;justify-content:center;gap:6px;padding:9px 4px;border-radius:10px;color:var(--muted);font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.seg button.on{background:var(--accent-soft);color:var(--accent)}

.empty{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:22px 10px;color:var(--muted);font-size:14px}
.empty .i{width:34px;height:34px;stroke-width:1.4}
.empty .acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:12px;background:var(--surface-2);color:var(--ink);font-weight:600;font-size:14px}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--neg)}
.btn .i{width:18px;height:18px}
.banner{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--c4) 18%,var(--surface));border:1px solid color-mix(in srgb,var(--c4) 40%,transparent);font-size:13.5px}
.banner .i{color:var(--c4)}
.banner span{flex:1}

/* projects / investments */
.proj{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.pc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;text-align:left;min-width:0}
.pc:hover{border-color:var(--accent)}
.pc .h{display:flex;align-items:center;gap:8px;min-width:0}
.pc .h .i{color:var(--accent)}
.pc .h b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .val{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.pc .meta{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:6px;font-variant-numeric:tabular-nums}
.prog{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:99px}
.alloc{display:flex;gap:2px;height:14px;border-radius:99px;overflow:hidden;margin-block:4px 10px}
.alloc i{display:block;height:100%;background:var(--c)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.legend span::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--c)}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kv div{display:flex;flex-direction:column;gap:2px;min-width:0}
.kv small{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.kv b{font-variant-numeric:tabular-nums;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.patri{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,9vw,40px);letter-spacing:-.03em;margin-block:2px 12px;font-variant-numeric:tabular-nums}
.klabel{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.klabel .i{width:16px;height:16px}

/* kanban */
.vt{display:flex;gap:2px;background:var(--surface-2);border-radius:11px;padding:2px}
.vt button{width:34px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--muted)}
.vt button.on{background:var(--surface);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.vt .i{width:17px;height:17px}
.funnel{display:flex;gap:2px;height:10px;border-radius:99px;overflow:hidden;background:var(--surface-2);margin-top:10px}
.funnel i{display:block;background:var(--c);min-width:6px}
.fleg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.fleg span{font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;gap:1px;min-width:0}
.fleg span::before{content:"";width:16px;height:4px;border-radius:2px;background:var(--c);margin-bottom:3px}
.fleg b{font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kb{width:min(1000px,calc(100vw - 32px));margin-left:calc((100% - min(1000px,calc(100vw - 32px)))/2)}
.kb-tabs{display:none}
.kb-cols{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:10px;align-items:start}
.kcol{background:var(--surface-2);border-radius:var(--r);padding:8px;display:flex;flex-direction:column;gap:8px;min-height:140px;outline:2px dashed transparent;outline-offset:-2px;transition:background .15s,outline-color .15s}
.kcol-h{display:flex;align-items:center;gap:6px;padding:4px 4px 2px;font-weight:700;font-size:13px}
.kcol-h .i{width:16px;height:16px;color:var(--c)}
.kcol-h em{font-style:normal;color:var(--muted);font-weight:600;font-size:12px;margin-left:auto;font-variant-numeric:tabular-nums}
.kcol.over,.kb-tab.over{outline-color:var(--accent);background:var(--accent-soft)}
.kempty{font-size:12.5px;color:var(--muted);text-align:center;padding:18px 8px;border:1.5px dashed var(--line);border-radius:12px}
.kb-tab{flex:1 0 auto;display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:7px 11px;border-radius:12px;border:1px solid var(--line);border-top:3px solid var(--c);background:var(--surface);font-size:12px;color:var(--muted);outline:2px dashed transparent;outline-offset:-2px;font-variant-numeric:tabular-nums}
.kb-tab b{font-size:13px;color:var(--ink);display:flex;gap:5px;align-items:center}
.kb-tab .i{width:14px;height:14px;color:var(--c)}
.kb-tab.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,var(--surface))}
@media (max-width:719px){
  .kb{width:auto;margin-left:0}
  .kb-tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:8px;padding:2px}
  .kb-cols{display:block}
  .kcol:not(.cur){display:none}
  .kcol-h{display:none}
}
.kc{position:relative;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:14px;padding:11px;display:flex;flex-direction:column;gap:8px;cursor:grab;touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:box-shadow .15s,transform .2s,opacity .15s}
.kc:hover{box-shadow:var(--shadow)}
.kc.lifted{opacity:.3}
.kc.swipe{transition:none}
.kc.swipe::after{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--accent);opacity:0;transition:opacity .15s;pointer-events:none}
.kc.swipe.go::after{opacity:.14}
.kc-h{display:flex;align-items:center;gap:8px;min-width:0}
.kc-h>.i{color:var(--c);flex:none}
.kc-h .t{font-weight:700;font-size:14px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ring{width:38px;height:38px;flex:none;position:relative}
.ring svg{width:38px;height:38px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:4}
.ring .bg{stroke:var(--surface-2)}
.ring .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:10.5px;font-weight:700;font-variant-numeric:tabular-nums}
.kc .left{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15}
.kc .left small{display:block;font-family:var(--f-body);font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.kc .meta{display:flex;flex-wrap:wrap;gap:6px}
.kc .gold{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:color-mix(in srgb,var(--gold) 17%,transparent);color:var(--ink);font-size:13px;text-align:left;width:100%}
.kc .gold .i{color:var(--gold);width:17px;height:17px;flex:none}
.kc .ka{display:flex;gap:6px}
.kc .adv{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:8px;border-radius:10px;background:var(--surface-2);font-weight:600;font-size:13px;color:var(--ink-2);min-height:36px}
.kc .adv:hover{background:var(--accent-soft);color:var(--accent)}
.kc .adv .i{width:16px;height:16px}
.kc .ka .ib{width:36px;height:36px;background:var(--surface-2)}
.kc.mini{padding:9px 11px;gap:0}
.kc.mini .kc-h b{font-size:13px;font-variant-numeric:tabular-nums}
.kc.mini .kc-h .ok{color:var(--pos);width:18px;height:18px}
.kstack:not(.open) .kc.mini:nth-child(2){margin-top:-30px;transform:scale(.95);z-index:-1}
.kstack:not(.open) .kc.mini:nth-child(3){margin-top:-30px;transform:scale(.9);z-index:-2}
.kstack:not(.open) .kc.mini:nth-child(n+4){display:none}
.kstack{display:flex;flex-direction:column;gap:6px;position:relative;z-index:0}
.kmore{align-self:center;font-size:12.5px;font-weight:600;color:var(--accent);padding:4px 8px}
.kghost{position:fixed;z-index:50;pointer-events:none;margin:0;box-shadow:0 22px 44px -12px rgba(0,0,0,.5);transform:rotate(2.5deg) scale(1.03);opacity:.96;transition:none}
body.dragging,body.dragging *{cursor:grabbing!important;user-select:none!important}
.kc.win{animation:win 1.4s ease}
@keyframes win{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--gold) 70%,transparent)}40%{box-shadow:0 0 0 10px color-mix(in srgb,var(--gold) 0%,transparent);transform:scale(1.03)}100%{transform:none}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.confetti i{position:absolute;top:45%;width:8px;height:12px;border-radius:2px;animation:conf 1.7s cubic-bezier(.15,.7,.4,1) forwards}
@keyframes conf{0%{transform:translate(0,0) rotate(0)}35%{transform:translate(calc(var(--dx)*.6),var(--dy)) rotate(calc(var(--r)*.4))}100%{transform:translate(var(--dx),70vh) rotate(var(--r));opacity:0}}
@media (prefers-reduced-motion:reduce){.kc,.ring .fg{transition:none}.kc.win{animation:none}}
.toast{display:flex;align-items:center;gap:14px}
.toast[hidden]{display:none}
.toast button{color:inherit;font-weight:800;text-decoration:underline;text-underline-offset:3px;padding:2px 0}

/* charts */
.chart{position:relative;width:100%;min-height:210px}
.chart svg{display:block;width:100%;overflow:visible}
.chart text{font-family:var(--f-body);font-size:11px;fill:var(--muted)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .base{stroke:var(--muted);stroke-width:1}
.chart .hl{fill:var(--surface-2)}
.chart .hit{fill:transparent;cursor:pointer}
.ctip{position:absolute;pointer-events:none;z-index:3;background:var(--ink);color:var(--bg);border-radius:10px;padding:8px 10px;font-size:12.5px;line-height:1.5;box-shadow:var(--shadow);min-width:150px;font-variant-numeric:tabular-nums}
.ctip b{display:block;font-size:12px;opacity:.75;margin-bottom:2px}
.ctip div{display:flex;align-items:center;gap:6px}
.ctip div em{font-style:normal;margin-left:auto;padding-left:12px;font-weight:700}
.ctip i{width:9px;height:9px;border-radius:3px;background:var(--c);flex:none}
.donut-wrap{display:grid;grid-template-columns:170px 1fr;gap:14px;align-items:center}
@media (max-width:420px){.donut-wrap{grid-template-columns:1fr;justify-items:center}}
.donut{position:relative;width:170px;height:170px}
.donut svg{width:170px;height:170px;transform:rotate(-90deg)}
.donut .ctr{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
.donut .ctr small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.donut .ctr b{font-family:var(--f-display);font-size:19px;font-variant-numeric:tabular-nums}
.donut circle.seg{cursor:pointer;transition:stroke-width .15s}
.donut circle.seg:hover{stroke-width:26}
.dleg{display:flex;flex-direction:column;gap:6px;width:100%;min-width:0}
.dleg div{display:grid;grid-template-columns:12px 1fr auto auto;gap:8px;align-items:center;font-size:13px;font-variant-numeric:tabular-nums}
.dleg i{width:12px;height:12px;border-radius:4px;background:var(--c)}
.dleg span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
.dleg em{font-style:normal;color:var(--muted);font-size:12px}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:7px 6px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
th .i{width:16px;height:16px;vertical-align:-3px}
tr.sel td{background:var(--accent-soft)}
tr.tot td{font-weight:700;border-bottom:0}
tbody tr{cursor:pointer}
.cmp{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.cmp .card{padding:12px}
.delta{font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:3px}
.delta .i{width:14px;height:14px;stroke-width:2.4}

/* sheet */
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:rgba(5,15,10,.45);animation:fade .18s ease}
.panel{position:relative;width:100%;max-width:560px;max-height:92%;overflow:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px));animation:up .22s cubic-bezier(.2,.8,.2,1)}
@media (min-width:640px){.sheet{align-items:center}.panel{border-radius:22px;max-height:86%}}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){.panel,.scrim{animation:none}}
.sh{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sh .ttl{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:700;font-size:17px;margin-right:auto}
.sh .ttl .i{color:var(--accent)}
form{display:flex;flex-direction:column;gap:12px}
.amt{display:flex;align-items:baseline;gap:8px;padding:6px 4px 10px;border-bottom:2px solid var(--line)}
.amt:focus-within{border-color:var(--accent);outline:none}
.amt span{font-family:var(--f-display);font-size:22px;color:var(--muted);font-weight:600}
.amt input{flex:1;min-width:0;border:0;background:none;color:var(--ink);font-family:var(--f-display);font-weight:800;font-size:38px;letter-spacing:-.02em;outline:none;font-variant-numeric:tabular-nums}
.fld{display:flex;align-items:center;gap:10px;background:var(--surface-2);border-radius:12px;padding:0 12px;min-height:46px}
.fld:focus-within{outline:2px solid var(--accent);outline-offset:0}
.fld .i{color:var(--muted);width:20px;height:20px}
.fld input,.fld select{flex:1;min-width:0;border:0;background:none;color:var(--ink);font:inherit;font-size:16px;outline:none;padding:11px 0}
.fld select option{background:var(--surface);color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px}
.pk{position:relative;display:grid;place-items:center;height:46px;border-radius:12px;background:var(--surface-2);color:var(--c,var(--ink-2));cursor:pointer;border:2px solid transparent;-webkit-touch-callout:none;user-select:none}
.pk input{position:absolute;opacity:0;pointer-events:none}
.pk:has(input:checked){border-color:var(--c,var(--accent));background:color-mix(in srgb,var(--c,var(--accent)) 16%,var(--surface))}
.pk.sw{background:var(--c)}
.pk.sw:has(input:checked){border-color:var(--ink);background:var(--c)}
.pick-name{font-size:12.5px;color:var(--muted);min-height:16px;margin-top:-6px}
.acts{display:flex;gap:10px;align-items:center;margin-top:4px}
.go{margin-left:auto;width:56px;height:56px;border-radius:18px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.go .i{width:28px;height:28px;stroke-width:2.4}
.del{width:46px;height:46px;border-radius:14px;background:var(--surface-2);color:var(--neg);display:grid;place-items:center;transition:background .15s}
.del.armed{background:var(--neg);color:#fff}
.toggle{display:flex;align-items:center;gap:12px;padding:6px 0}
.toggle>span:not(.sw2){flex:1;min-width:0}
.toggle .sw2{flex:none}
.sw2{width:48px;height:28px;border-radius:99px;background:var(--surface-2);position:relative;border:1px solid var(--line);flex:none}
.sw2::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:transform .15s,background .15s}
.sw2.on{background:var(--accent-soft)}
.sw2.on::after{transform:translateX(20px);background:var(--accent)}
.note{font-size:12.5px;color:var(--muted)}
textarea{width:100%;min-height:120px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font:12px ui-monospace,Consolas,monospace;padding:10px}

/* tooltip + toast */
.tip{position:fixed;z-index:40;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12.5px;font-weight:600;padding:6px 10px;border-radius:8px;white-space:nowrap;box-shadow:var(--shadow);transform:translate(-50%,calc(-100% - 8px))}
.tip.below{transform:translate(-50%,8px)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.loading{display:grid;place-items:center;padding:80px 0;color:var(--muted)}
.loading .i{width:30px;height:30px;animation:spin 1.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>

let DB=null,UID=null;const dirty=new Set(),inflight=new Set();let flushT=null;
const docName=k=>k==='cfg'?'config':'m-'+k;
function markDirty(...keys){keys.forEach(k=>dirty.add(k));clearTimeout(flushT);flushT=setTimeout(flush,350);}
async function flush(){
  if(S.mode==='local'){writeLocal();dirty.clear();return}
  for(const k of [...dirty]){
    if(inflight.has(k))continue;
    dirty.delete(k);inflight.add(k);
    const body=k==='cfg'?S.cfg:(S.months[k]||emptyMonth());
    try{await DB.collection('data/users/'+UID).doc(docName(k)).set(clone(body))}
    catch(e){if(e&&e.code==='unavailable'){dirty.add(k)}
      else if(e&&(e.code==='invalid_argument'||e.code==='not_granted'||e.code==='revoked')){inflight.delete(k);S.mode='local';flush();toast('Sem permissão para salvar na nuvem. Seus dados ficam salvos neste aparelho.');render();return}
      else{toast('Não foi possível salvar ('+(e&&e.code||'erro')+')')}}
    inflight.delete(k);
  }
  if(dirty.size){clearTimeout(flushT);flushT=setTimeout(flush,900)}
}
function save(...keys){markDirty(...keys);render()}

function loadLocal(){
  let d=null;try{d=JSON.parse(localStorage.getItem(LS_KEY)||'null')}catch(e){}
  return d&&d.cfg?d:null;

async function boot(){
  if(!window.claude||!window.claude.use){startLocal();return}
  const tm=setTimeout(()=>{if(!S.ready)startLocal()},11000);
  let db=null,user=null;
  try{[db,user]=await Promise.all([claude.use('db'),claude.use('user')])}catch(e){}
  let id=null;try{id=user?await user.id():null}catch(e){}
  clearTimeout(tm);
  if(!db||!id){if(!S.ready)startLocal();return}
  DB=db;UID=id;S.mode='cloud';
  let first=true;
  DB.collection('data/users/'+UID).onSnapshot(snap=>{
    if(S.mode==='local')return;
    for(const ch of snap.docChanges()){
      const nm=ch.doc.id;const k=nm==='config'?'cfg':nm.startsWith('m-')?nm.slice(2):null;if(!k)continue;
      if(dirty.has(k)||inflight.has(k))continue;
      if(ch.type==='removed'){if(k==='cfg')continue;delete S.months[k];continue}
      const d=ch.doc.data();if(k==='cfg')S.cfg=clone(d);else S.months[k]=clone(d);
    }
    if(first){first=false;
      if(!S.cfg){const loc=loadLocal();
        if(loc){S.cfg=loc.cfg;S.months=loc.months||{};markDirty('cfg',...Object.keys(S.months))}
        else{S.cfg=newCfg();markDirty('cfg')}}
      S.ready=true;
    }
    render();
  },err=>{toast('Sincronização interrompida. Recarregue a página.')});
}
function startLocal(){
  if(S.ready)return;S.mode='local';
  const box=lockedBox();if(box){showLock(box);return}
  const d=loadLocal();S.cfg=d?d.cfg:newCfg();S.months=d?(d.months||{}):{};S.ready=true;render();
}

/* ---------- password lock: AES-256-GCM, key derived from the password with PBKDF2-SHA256 ---------- */
// The password itself is never stored. Only the random salt, the IV and the ciphertext go to localStorage / the backup file.
const KDF_ITER=600000,ENC_TAG='invext-aes-gcm-1';
const LOCK={key:null,salt:null,iter:KDF_ITER};
const canCrypt=()=>!!(window.crypto&&crypto.subtle&&window.isSecureContext!==false);
const b64=buf=>{const u=new Uint8Array(buf);let t='';for(let i=0;i<u.length;i+=32768)t+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(t)};
const unb64=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
async function deriveKey(pw,salt,iter=KDF_ITER){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function seal(text){const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},LOCK.key,new TextEncoder().encode(text));
  return {enc:ENC_TAG,kdf:'PBKDF2-SHA256',iter:LOCK.iter,salt:b64(LOCK.salt),iv:b64(iv),ct:b64(ct)}}
async function unseal(box,key){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(box.iv)},key,unb64(box.ct));return JSON.parse(new TextDecoder().decode(pt))}
async function openBox(box,pw){const key=await deriveKey(pw,unb64(box.salt),box.iter||KDF_ITER);return {key,data:await unseal(box,key)}} // throws on wrong password
function lockedBox(){try{const d=JSON.parse(localStorage.getItem(LS_KEY)||'null');return d&&d.enc===ENC_TAG?d:null}catch(e){return null}}
let localQ=Promise.resolve();
function writeLocal(){const text=JSON.stringify({cfg:S.cfg,months:S.months}),key=LOCK.key;
  localQ=localQ.then(async()=>{try{localStorage.setItem(LS_KEY,key?JSON.stringify(await seal(text)):text)}catch(e){toast('Não foi possível salvar neste aparelho')}});return localQ}
function showLock(box){
  hideSplash();$('#top').innerHTML='';$('#nav').innerHTML='';$('#fab').hidden=true;
  $('#view').innerHTML=`<div class="lock">${LOGO()}<h2>Invext protegido</h2><div class="note">Digite sua senha para abrir seus dados.</div>
    ${form(`${fText('f_pw','lock','Senha','','password','autocomplete="current-password" required')}<div class="err" id="f_err" role="alert"></div><button class="go" id="f_go">${ic('lock')}Abrir</button>`,async()=>{
      const pw=val('f_pw');if(!pw)return;const go=$('#f_go');go.disabled=true;go.lastChild.textContent='Abrindo…';
      try{const r=await openBox(box,pw);LOCK.key=r.key;LOCK.salt=unb64(box.salt);LOCK.iter=box.iter||KDF_ITER;
        S.cfg=r.data.cfg;S.months=r.data.months||{};SUBMIT=null;S.ready=true;
        if(LOCK.iter!==KDF_ITER){await relock(pw)} // upgrade old files to the current iteration count
        render()}
      catch(e){go.disabled=false;go.lastChild.textContent='Abrir';$('#f_err').textContent='Senha incorreta.';const f=$('#f_pw');f.value='';f.focus()}
    })}
    <button class="btn danger" data-act="forgotPw" style="margin-top:18px">${ic('trash')}Esqueci a senha</button></div>`;
  setTimeout(()=>$('#f_pw')?.focus(),80);
}
async function relock(pw){LOCK.salt=crypto.getRandomValues(new Uint8Array(16));LOCK.iter=KDF_ITER;LOCK.key=await deriveKey(pw,LOCK.salt);await writeLocal()}
async function checkPw(pw){const box=lockedBox();if(!box)return false;try{await openBox(box,pw);return true}catch(e){return false}}
async function lockNow(){if(!LOCK.key)return;clearTimeout(flushT);await writeLocal();location.reload()}
let hiddenAt=0;document.addEventListener('visibilitychange',()=>{if(document.hidden)hiddenAt=Date.now();else if(LOCK.key&&hiddenAt&&Date.now()-hiddenAt>5*60e3)lockNow()});
const pwRules=`<div class="note">Use uma senha longa, com 8 caracteres ou mais (uma frase também serve). Ela não fica guardada em lugar nenhum.</div>`;
function sheetSetPw(){
  openSheet('Proteger com senha','lock',form(`<div class="note">Seus dados neste aparelho e os arquivos de backup passam a ser criptografados (AES-256). Sem a senha, ninguém consegue lê-los, <b>nem você</b>: se esquecer a senha, os dados não podem ser recuperados.</div>

/* ---------- calculations ---------- */
let memo={};
function calc(ym){
  if(memo[ym])return memo[ym];
  const c=S.cfg,m=S.months[ym]||emptyMonth();
  const incs=c.incomes.filter(x=>active(x,ym)),bills=c.bills.filter(x=>active(x,ym));
  const incF=sum(incs),incX=sum(m.extras||[]),fix=sum(bills),vari=sum(m.expenses||[]);
  let inv=0;for(const v of c.investments)for(const mv of v.moves||[])if(mv.date.slice(0,7)===ym)inv+=mv.amount;
  const byCat={};for(const b of bills)byCat[b.catId]=(byCat[b.catId]||0)+b.amount;for(const e of m.expenses||[])byCat[e.catId]=(byCat[e.catId]||0)+e.amount;
  const r={incF,incX,inc:incF+incX,fix,vari,out:fix+vari,inv,result:incF+incX-fix-vari-inv,byCat,bills,incs};
  return memo[ym]=r;
}
function carryIn(ym){
  const c=S.cfg;if(!c.carry)return 0;let t=0,n=0;
  for(let y=c.startMonth;y<ym&&n<600;y=ymAdd(y,1),n++)t+=calc(y).result;
  return t;
}
/* ---------- projection ---------- */
const PROFILES={conservador:{name:'Conservador',icon:'shield',rate:9.5},moderado:{name:'Moderado',icon:'pie',rate:10.5},arrojado:{name:'Arrojado',icon:'trend',rate:12}};
const SUG={
  tesouro:{s:'Tesouro Selic',m:'Tesouro Prefixado',l:'Tesouro IPCA+'},
  cdb:{s:'CDB com liquidez diária',m:'CDB / LCI / LCA com vencimento no prazo',l:'CDB / LCI / LCA de longo prazo'},
  fii:{s:'Fundos imobiliários (FIIs)'},acoes:{s:'Ações ou ETF de índice'},exterior:{s:'ETF internacional'},cripto:{s:'Cripto (parcela pequena)'}};
const HORIZ={s:'curto prazo',m:'médio prazo',l:'longo prazo'};
function monthsBetween(a,b){const [ay,am]=a.split('-').map(Number),[by,bm]=b.split('-').map(Number);return (by-ay)*12+(bm-am)}
const isReserva=p=>!!p.reserva||/reserva|emerg/i.test(p.name);
function payDay(){const ym=thisYM();const inc=S.cfg.incomes.filter(x=>active(x,ym)&&x.day).sort((a,b)=>b.amount-a.amount)[0];return inc?inc.day:null}
function investDay(){const d=payDay();return d?Math.min(28,d+1):5}
function avgMonths(f,n=3){let t=0,c=0;for(let i=1;i<=n;i++){const ym=ymAdd(thisYM(),-i);if(ym<S.cfg.startMonth&&!S.months[ym])continue;t+=f(calc(ym));c++}return c?t/c:0}
function projMoves(p,ym){let t=0;for(const v of S.cfg.investments)if(v.projectId===p.id)for(const m of v.moves||[])if(m.date.slice(0,7)===ym)t+=m.amount;return t}
const fmtMonths=k=>k<12?`${k} ${k===1?'mês':'meses'}`:`${Math.floor(k/12)} ano${k>=24?'s':''}${k%12?` e ${k%12} ${k%12===1?'mês':'meses'}`:''}`;
function allocFor(p,n){
  const pr=p.profile||'moderado';let h,mix;
  if(isReserva(p)||(n!=null&&n<=12)){h='s';mix={tesouro:50,cdb:50}}
  else if(n!=null&&n<=36){h='m';mix={conservador:{cdb:60,tesouro:40},moderado:{cdb:50,tesouro:30,fii:20},arrojado:{cdb:40,tesouro:20,fii:20,acoes:20}}[pr]}
  else if(n!=null&&n<=84){h='l';mix={conservador:{tesouro:50,cdb:40,fii:10},moderado:{tesouro:40,cdb:20,fii:20,acoes:20},arrojado:{tesouro:25,cdb:10,fii:20,acoes:35,exterior:10}}[pr]}
  else{h='l';mix={conservador:{tesouro:50,cdb:20,fii:20,acoes:10},moderado:{tesouro:35,fii:20,acoes:30,exterior:15},arrojado:{tesouro:20,fii:15,acoes:40,exterior:20,cripto:5}}[pr]}
  return {h,list:Object.entries(mix).map(([type,pct])=>({type,pct,label:SUG[type][h]||SUG[type].s}))};
}
function distribute(amount,alloc,invs){
  if(!(amount>0))return alloc.map(a=>({...a,amount:0}));
  const by={};for(const v of invs)by[v.type]=(by[v.type]||0)+(v.current||0);
  const total=sum(invs,v=>v.current)+amount;
  const gaps=alloc.map(a=>Math.max(0,total*a.pct/100-(by[a.type]||0))),g=gaps.reduce((a,b)=>a+b,0);
  return alloc.map((a,i)=>({...a,amount:Math.round((g>0?amount*gaps[i]/g:amount*a.pct/100)/10)*10}));
}
function projCalc(p){
  if(memo['p:'+p.id])return memo['p:'+p.id];
  const invs=S.cfg.investments.filter(v=>v.projectId===p.id),cur=sum(invs,v=>v.current);
  const rateA=(p.rate||PROFILES[p.profile||'moderado'].rate)/100,r=Math.pow(1+rateA,1/12)-1;
  const now=thisYM(),n=p.deadline?monthsBetween(now,p.deadline):null;
  const thisM=projMoves(p,now);let avg=0;for(let i=1;i<=3;i++)avg+=projMoves(p,ymAdd(now,-i));avg/=3;
  let pmt=null,status='nogoal',eta=null;
  if(p.goal&&cur>=p.goal)status='done';
  else if(p.goal&&n!=null){if(n<=0)status='overdue';else{const need=p.goal-cur*Math.pow(1+r,n);pmt=need<=0?0:need*r/(Math.pow(1+r,n)-1);status=(pmt===0||avg>=pmt*.95||thisM>=pmt*.95)?'ok':'behind'}}
  else if(p.goal){status='nodl';if(avg>0||cur>0){let v=cur,k=0;while(v<p.goal&&k<600){v=v*(1+r)+Math.max(0,avg);k++}eta=k<600?k:null}}
  const al=allocFor(p,n);
  const remain=pmt!=null?Math.max(0,pmt-Math.max(0,thisM)):0;
  const whereAmt=remain>0?remain:(pmt||Math.max(0,avg)||0);
  return memo['p:'+p.id]={p,invs,cur,rateA,n,thisM,avg,pmt,status,eta,h:al.h,alloc:al.list,remain,where:distribute(whereAmt,al.list,invs)};
}
const STATUS={done:['Meta atingida','check','var(--pos)'],ok:['Em dia','check','var(--pos)'],behind:['Atrasado','alert','var(--warn)'],overdue:['Prazo vencido','alert','var(--neg)'],nodl:['Sem prazo','calendar','var(--muted)'],nogoal:['Sem meta','target','var(--muted)']};

const SEV={crit:'var(--neg)',warn:'var(--warn)',info:'var(--accent)',good:'var(--pos)'};
const SEV_ORDER={crit:0,warn:1,info:2,good:3};
const NTYPES=[['contas','receipt','Contas'],['gastos','cart','Gastos'],['investir','trend','Investir'],['metas','target','Metas']];
function alerts(){
  if(memo.alerts)return memo.alerts;
  const out=[],c=S.cfg,ym=thisYM(),td=new Date().getDate(),r=calc(ym),m=S.months[ym]||emptyMonth();
  const dim=new Date(+ym.slice(0,4),+ym.slice(5),0).getDate();
  for(const b of r.bills){if(m.paid?.[b.id]||!b.day)continue;const d=b.day-td;
    if(d<0)out.push({k:`venc-${ym}-${b.id}`,t:'contas',s:'crit',i:'receipt',title:`${b.name} venceu no dia ${b.day}`,text:`${money(b.amount)} ainda não marcado como pago.`,act:'goSubNow',v:'fix'});
    else if(d<=3)out.push({k:`prox-${ym}-${b.id}`,t:'contas',s:'warn',i:'receipt',title:d===0?`${b.name} vence hoje`:`${b.name} vence em ${d} dia${d>1?'s':''}`,text:`${money(b.amount)} · dia ${b.day}`,act:'goSubNow',v:'fix'});}
  if(r.result<0)out.push({k:`neg-${ym}`,t:'gastos',s:'crit',i:'wallet',title:'Mês no vermelho',text:`As saídas passaram as entradas em ${money(-r.result)}.`,act:'tab',v:'home'});
  const avgVar=avgMonths(x=>x.vari);
  if(avgVar>0&&td>=5){const pr=r.vari/td*dim;if(pr>avgVar*1.15)out.push({k:`ritmo-${ym}`,t:'gastos',s:'warn',i:'cart',title:'Gastos variáveis acima do normal',text:`No ritmo atual o mês fecha em ${money0(pr)}; sua média é ${money0(avgVar)}.`,act:'goSubNow',v:'var'})}
  const prevCat={};for(let i=1;i<=3;i++){const x=calc(ymAdd(ym,-i));for(const k in x.byCat)prevCat[k]=(prevCat[k]||0)+x.byCat[k]/3}
  for(const [k,v] of Object.entries(r.byCat)){const a=prevCat[k];if(a>0&&v>a*1.25&&v-a>80){const ct=cat(k);out.push({k:`cat-${ym}-${k}`,t:'gastos',s:'warn',i:ct.icon,title:`${ct.name}: ${Math.round((v/a-1)*100)}% acima da média`,text:`${money0(v)} este mês; média de ${money0(a)}.`,act:'goSubNow',v:'var'})}}
  const ps=c.projects.map(projCalc),iday=investDay();
  for(const x of ps)if(x.pmt>0&&x.remain>x.pmt*.05&&td>=iday){const w=x.where.filter(z=>z.amount>=10);
    out.push({k:`inv-${ym}-${x.p.id}`,t:'investir',s:'info',i:'trend',title:`Hora de investir ${money0(x.remain)} em ${x.p.name}`,text:w.length?'Sugestão: '+w.map(z=>`${z.label} ${money0(z.amount)}`).join(' · '):'',act:'tab',v:'proj'})}
  const free=carryIn(ym)+r.result;
  if(!c.projects.length&&free>300)out.push({k:`free-${ym}`,t:'investir',s:'info',i:'coins',title:`Você tem ${money0(free)} disponíveis`,text:'Crie um projeto (como a reserva de emergência) para eu sugerir quanto e onde investir.',act:'tab',v:'proj'});
  const now=Date.now();
  for(const v of c.investments){const last=v.updatedAt||Math.max(0,...(v.moves||[]).map(z=>Date.parse(z.date)||0));
    if(last&&now-last>35*864e5)out.push({k:`upd-${v.id}-${ym}`,t:'investir',s:'info',i:'pencil',title:`Atualize o valor de ${v.name}`,text:`Última atualização há ${Math.floor((now-last)/864e5)} dias.`,act:'invDetail',v:v.id})}
  for(const x of ps){const p=x.p;
    if(x.status==='done')out.push({k:`done-${p.id}-${p.goal}`,t:'metas',s:'good',i:'check',title:`Meta atingida: ${p.name}`,text:`${money0(x.cur)} de ${money0(p.goal)}. Hora de definir o próximo objetivo.`,act:'tab',v:'proj'});
    else if(x.status==='behind')out.push({k:`late-${ym}-${p.id}`,t:'metas',s:'warn',i:'alert',title:`${p.name} está atrasado`,text:`Precisa de ${money0(x.pmt)}/mês; sua média recente é ${money0(x.avg)}.`,act:'tab',v:'proj'});
    else if(x.status==='overdue')out.push({k:`over-${p.id}-${p.deadline}`,t:'metas',s:'crit',i:'calendar',title:`O prazo de ${p.name} passou`,text:`Faltam ${money0(p.goal-x.cur)}. Defina um novo prazo.`,act:'editProject',v:p.id});}
  if(S.mode==='local'&&(c.incomes.length||c.bills.length)&&!c.demo){const lb=c.lastBackup||0,days=Math.floor((now-lb)/864e5);
    if(days>=14)out.push({k:`bkp-${ym}-${Math.floor(days/14)}`,t:'backup',s:'warn',i:'download',title:lb?`Seu último backup foi há ${days} dias`:'Faça seu primeiro backup',text:'Os dados ficam só neste aparelho. Exporte um arquivo e guarde no Drive ou nos Arquivos.',act:'export'})}
  return memo.alerts=out.sort((a,b)=>SEV_ORDER[a.s]-SEV_ORDER[b.s]);
}

/* ---------- kanban ---------- */
const PSTAGES=[{id:'plan',name:'Planejando',icon:'note',c:9,d:'Ideia, ainda sem dinheiro guardado'},{id:'save',name:'Poupando',icon:'coins',c:1,d:'Guardando aos poucos'},{id:'near',name:'Quase lá',icon:'trend',c:4,d:'Falta pouco para a meta'},{id:'done',name:'Concluído',icon:'check',c:3,d:'Meta alcançada'}];
const BSTAGES=[{id:'late',name:'Atrasadas',icon:'alert',c:8},{id:'due',name:'A vencer',icon:'calendar',c:1},{id:'paid',name:'Pagas',icon:'check',c:3}];
const KB_EMPTY={plan:'Ideias e sonhos ainda sem dinheiro.',save:'Projetos em que você já está guardando.',near:'Projetos com 80% ou mais da meta.',done:'Metas alcançadas aparecem aqui.',late:'Nenhuma conta atrasada.',due:'Nada a vencer.',paid:'Nenhuma conta paga ainda.'};
const mShort=v=>'R$ '+short(v);
function pStage(x){const p=x.p;if(p.stage&&PSTAGES.some(s=>s.id===p.stage))return p.stage;if(x.status==='done')return 'done';if(x.cur<=0)return 'plan';return p.goal&&x.cur/p.goal>=.8?'near':'save'}
function bStage(b,m,ym){if(m.paid?.[b.id])return 'paid';const now=thisYM();if(ym!==now)return ym<now?'late':'due';return b.day&&b.day<new Date().getDate()?'late':'due'}
function viewToggle(act,cur){return `<div class="vt" role="group" aria-label="Visualização"><button class="${cur==='board'?'on':''}" data-act="${act}" data-v="board" data-tip="Quadro" aria-label="Quadro" aria-pressed="${cur==='board'}">${ic('cols')}</button><button class="${cur!=='board'?'on':''}" data-act="${act}" data-v="list" data-tip="Lista" aria-label="Lista" aria-pressed="${cur!=='board'}">${ic('list')}</button></div>`}
function ring(pct){const r=16,L=2*Math.PI*r;return `<div class="ring" aria-hidden="true"><svg viewBox="0 0 38 38"><circle class="bg" cx="19" cy="19" r="${r}"/><circle class="fg" cx="19" cy="19" r="${r}" stroke-dasharray="${L.toFixed(1)}" stroke-dashoffset="${(L*(1-Math.min(1,Math.max(0,pct)))).toFixed(1)}"/></svg><span>${Math.min(999,Math.round(pct*100))}%</span></div>`}
function boardHTML(kb,cols,cur){

}
function projBoard(ps){

function pCardK(x,st){
  const p=x.p,[sl,si,sc]=STATUS[x.status],i=PSTAGES.findIndex(s=>s.id===st.id),nx=PSTAGES[i+1];
  const left=p.goal?Math.max(0,p.goal-x.cur):null;
  const cd=p.deadline?(x.n>0?fmtMonths(x.n):x.n===0?'vence este mês':'prazo vencido'):null;
  return `<div class="kc" data-kb="proj" data-id="${p.id}" data-col="${st.id}" style="--c:var(--c${st.c})" data-act="kopen" data-v="${p.id}" tabindex="0" aria-label="${esc(p.name)}, etapa ${st.name}">
    <div class="kc-h">${ic(p.icon||'target')}<span class="t">${esc(p.name)}</span>${p.goal?ring(x.cur/p.goal):''}</div>
    <div class="left">${left!=null?`<small>Faltam</small>${money0(left)}`:`<small>Guardado</small>${money0(x.cur)}`}</div>
    <div class="meta">${cd?`<span class="pill" style="--s:var(--ink-2)">${ic('calendar')}${cd}</span>`:''}<span class="pill" style="--s:${sc}">${ic(si)}${sl}</span></div>

    <div class="ka">${nx?`<button class="adv" data-act="kadv" data-v="proj|${p.id}" aria-label="Avançar para ${nx.name}">${nx.name}${ic('chevR')}</button>`:''}<button class="ib" data-act="kmenu" data-v="${p.id}" data-tip="Mover para…" aria-label="Mover para">${ic('dots')}</button></div></div>`;
}
function billBoard(r,m){
  const cols=BSTAGES.map(s=>{const list=r.bills.filter(b=>bStage(b,m,S.ym)===s.id).sort((a,b)=>(a.day||99)-(b.day||99));return {...s,list,v:sum(list)}});
  for(const c of cols)c.html=c.list.map(b=>{const ct=cat(b.catId),pd=c.id==='paid';
    return `<div class="kc" data-kb="bill" data-id="${b.id}" data-col="${c.id}" style="--c:var(--c${ct.color})" data-act="editBill" data-v="${b.id}" tabindex="0" aria-label="${esc(b.name)}, ${c.name}">
      <div class="kc-h">${ic(ct.icon)}<span class="t">${esc(b.name)}</span></div>
      <div class="left">${money(b.amount)}</div>
      <div class="meta"><span class="pill" style="--s:${c.id==='late'?'var(--neg)':'var(--ink-2)'}">${ic(c.id==='late'?'alert':'calendar')}dia ${b.day||'—'}</span><span class="pill" style="--s:var(--ink-2)">${esc(ct.name)}</span></div>

let LAST=null;
function kMove(kb,id,col){
  let from,name;
  if(kb==='proj'){
    const p=S.cfg.projects.find(z=>z.id===id);if(!p)return;from=pStage(projCalc(p));if(from===col)return;
    LAST={kb,id,raw:p.stage,doneGoal:p.doneGoal};p.stage=col;if(col==='done')p.doneGoal=p.goal;name=PSTAGES.find(s=>s.id===col).name;
    S.kcol.proj=S.kcol.proj||from;save('cfg');
  }else{
    const m=ensureMonth(S.ym),b=S.cfg.bills.find(z=>z.id===id);if(!b)return;from=bStage(b,m,S.ym);if(from===col)return;
    if(col!=='paid'&&from!=='paid'){toast('Essa coluna segue o dia de vencimento');return}
    S.kcol.bill=S.kcol.bill||from;LAST={kb,id,ym:S.ym,paid:!!m.paid[id]};if(col==='paid')m.paid[id]=true;else delete m.paid[id];name=col==='paid'?'Pagas':BSTAGES.find(s=>s.id===bStage(b,m,S.ym)).name;save(S.ym);
  }
  const it=kb==='proj'?S.cfg.projects.find(z=>z.id===id).name:S.cfg.bills.find(z=>z.id===id).name;
  toastUndo(`${it} → ${name}`);$('#live').textContent=`${it} movido para ${name}`;
  if(navigator.vibrate)try{navigator.vibrate(12)}catch(_){}
}
function kAdvance(kb,id){
  if(kb==='proj'){const p=S.cfg.projects.find(z=>z.id===id);if(!p)return;const i=PSTAGES.findIndex(s=>s.id===pStage(projCalc(p)));if(i<PSTAGES.length-1)kMove(kb,id,PSTAGES[i+1].id)}
  else{const m=ensureMonth(S.ym),b=S.cfg.bills.find(z=>z.id===id);if(!b)return;kMove(kb,id,m.paid[id]?(S.ym<thisYM()||(S.ym===thisYM()&&b.day&&b.day<new Date().getDate())?'late':'due'):'paid')}
}
function kUndo(){
  const L=LAST;if(!L)return;LAST=null;$('#toast').hidden=true;
  if(L.kb==='proj'){const p=S.cfg.projects.find(z=>z.id===L.id);if(!p)return;if(L.raw==null)delete p.stage;else p.stage=L.raw;if(L.doneGoal==null)delete p.doneGoal;else p.doneGoal=L.doneGoal;save('cfg')}
  else{const m=ensureMonth(L.ym);if(L.paid)m.paid[L.id]=true;else delete m.paid[L.id];save(L.ym)}
  $('#live').textContent='Movimento desfeito';
}
function sheetKMenu(id){
  const p=S.cfg.projects.find(z=>z.id===id);if(!p)return;const cur=pStage(projCalc(p));
  openSheet('Mover '+p.name,'cols',`<div class="stack" style="gap:4px">${PSTAGES.map(s=>`<button class="wr" data-act="kto" data-v="${id}|${s.id}" style="--c:var(--c${s.c})" ${s.id===cur?'aria-current="true"':''}><span class="ico">${ic(s.icon)}</span><span><b style="font-weight:600">${s.name}</b><small>${s.d}</small></span>${s.id===cur?ic('check'):''}</button>`).join('')}</div>`);

function sheetKOpen(id){const p=S.cfg.projects.find(z=>z.id===id);if(!p)return;openSheet(p.name,p.icon||'target',projCard(projCalc(p)).replace('class="card stack"','class="stack"'))}
function autoDone(){
  const won=[];
  for(const p of S.cfg.projects){if(!(p.goal>0)||p.doneGoal===p.goal)continue;const x=projCalc(p);if(x.cur>=p.goal){p.doneGoal=p.goal;p.doneAt=Date.now();p.stage='done';won.push(p)}}
  if(won.length)markDirty('cfg');return won;
}
function celebrate(won){
  toast(won.length>1?`${won.length} metas atingidas!`:`Meta atingida: ${won[0].name}!`);$('#live').textContent='Meta atingida: '+won.map(p=>p.name).join(', ');
  if(navigator.vibrate)try{navigator.vibrate([20,60,20])}catch(_){}
  for(const p of won){const el=document.querySelector(`.kc[data-kb="proj"][data-id="${p.id}"]`);if(el)el.classList.add('win')}
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const w=document.createElement('div');w.className='confetti';const cs=['var(--gold)','var(--accent)','var(--c1)','var(--c5)','var(--c3)'];
  for(let i=0;i<40;i++){const s=document.createElement('i');s.style.cssText=`left:${50+(Math.random()-.5)*24}%;background:${cs[i%cs.length]};--dx:${Math.round((Math.random()-.5)*380)}px;--dy:${-140-Math.round(Math.random()*240)}px;--r:${Math.round(Math.random()*720-360)}deg;animation-delay:${(Math.random()*.15).toFixed(2)}s`;w.appendChild(s)}
  document.body.appendChild(w);setTimeout(()=>w.remove(),2000);
}

function donutHTML(d,total){
  const R=62,C=2*Math.PI*R,tot=sum(d.items,x=>x.v)||1;let off=0;const gap=d.items.length>1?2:0;
  const segs=d.items.map((x,i)=>{const len=x.v/tot*C;const s=`<circle class="seg" data-di="${i}" cx="85" cy="85" r="${R}" fill="none" stroke="var(--c${x.c})" stroke-width="22" stroke-dasharray="${Math.max(.1,len-gap)} ${C}" stroke-dashoffset="${-off}"/>`;off+=len;return s}).join('');
  return `<div class="donut-wrap"><div class="donut chart" data-chart="donut" style="min-height:0"><svg viewBox="0 0 170 170">${segs}</svg><div class="ctr"><small>Total</small><b>${money0(total)}</b></div><div class="ctip" hidden></div></div>
  <div class="dleg">${d.items.map(x=>`<div style="--c:var(--c${x.c})"><i></i><span>${esc(x.n)}</span><b>${money0(x.v)}</b><em>${(x.v/tot*100).toFixed(0)}%</em></div>`).join('')}</div></div>`;
}
function nice(v){if(v<=0)return 1;const e=Math.pow(10,Math.floor(Math.log10(v))),f=v/e;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*e}
function barPath(x,y0,y1,w,r){ // rounded data-end, square at baseline
  const h=Math.abs(y1-y0);if(h<.5)return '';r=Math.min(r,h,w/2);
  if(y1<y0)return `M${x},${y0}V${y1+r}Q${x},${y1} ${x+r},${y1}H${x+w-r}Q${x+w},${y1} ${x+w},${y1+r}V${y0}Z`;
  return `M${x},${y0}V${y1-r}Q${x},${y1} ${x+r},${y1}H${x+w-r}Q${x+w},${y1} ${x+w},${y1-r}V${y0}Z`;
}
function drawCharts(){
  document.querySelectorAll('.chart[data-chart]').forEach(el=>{
    const d=CH[el.dataset.chart];if(!d)return;
    if(d.type==='growth'){drawGrowth(el,d);return}
    if(d.type!=='bars')return;
    const W=Math.max(260,el.clientWidth),H=210,pl=46,pr=6,pt=10,pb=24,n=d.labels.length,k=d.series.length;
    const all=d.series.flatMap(s=>s.v);let mx=Math.max(0,...all),mn=Math.min(0,...all);
    const step=nice((mx-mn)/4||1);mx=Math.ceil(mx/step)*step||step;mn=Math.floor(mn/step)*step;
    const y=v=>pt+(mx-v)/(mx-mn)*(H-pt-pb);const gw=(W-pl-pr)/n;
    const bw=Math.max(3,Math.min(16,(gw-8)/k-2));const inner=k*bw+(k-1)*2;
    let s=`<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="${esc(d.series.map(x=>x.n).join(', '))} por mês">`;
    for(let v=mn;v<=mx+1e-9;v+=step){s+=`<line class="${Math.abs(v)<1e-9?'base':'grid'}" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${short(v)}</text>`}
    const sel=S.ym;
    d.labels.forEach((ym,i)=>{const gx=pl+i*gw;if(ym===sel&&d.pick)s+=`<rect class="hl" x="${gx+1}" y="${pt}" width="${gw-2}" height="${H-pt-pb}" rx="6"/>`;});
    s+=`<line class="base" x1="${pl}" x2="${W-pr}" y1="${y(0)}" y2="${y(0)}"/>`;
    d.labels.forEach((ym,i)=>{const gx=pl+i*gw+(gw-inner)/2;
      d.series.forEach((se,j)=>{const v=se.v[i];const col=se.signed?(v<0?'var(--c8)':'var(--c1)'):`var(--c${se.c})`;const p=barPath(gx+j*(bw+2),y(0),y(v),bw,3);if(p)s+=`<path d="${p}" fill="${col}"/>`});
      const m=+ym.slice(5);s+=`<text x="${pl+i*gw+gw/2}" y="${H-6}" text-anchor="middle" style="${ym===sel?'fill:var(--ink);font-weight:700':''}">${gw<30?MESES[m-1][0]:MESES[m-1]}</text>`;
      s+=`<rect class="hit" data-i="${i}" x="${pl+i*gw}" y="0" width="${gw}" height="${H}"/>`;});
    el.innerHTML=s+'</svg><div class="ctip" hidden></div>';
  });
}
function drawGrowth(el,d){
  const W=Math.max(260,el.clientWidth),H=200,pl=50,pr=10,pt=10,pb=24,n=d.labels.length;
  const step=nice(Math.max(...d.tot)/4||1),mx=Math.ceil(Math.max(...d.tot)/step)*step||step;
  const x=i=>pl+i*(W-pl-pr)/(n-1),y=v=>pt+(mx-v)/mx*(H-pt-pb);
  const line=a=>a.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
  let s=`<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Crescimento do patrimônio simulado">`;
  for(let v=0;v<=mx+1e-9;v+=step)s+=`<line class="${v?'grid':'base'}" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${short(v)}</text>`;
  s+=`<path d="${line(d.ap)}L${x(n-1)},${y(0)}L${x(0)},${y(0)}Z" fill="var(--c1)" fill-opacity=".22"/>`;
  s+=`<path d="${line(d.tot)}${d.ap.map((v,i)=>[i,v]).reverse().map(([i,v])=>`L${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('')}Z" fill="var(--c3)" fill-opacity=".22"/>`;
  s+=`<path d="${line(d.ap)}" fill="none" stroke="var(--c1)" stroke-width="2"/><path d="${line(d.tot)}" fill="none" stroke="var(--c3)" stroke-width="2"/>`;
  s+=`<circle cx="${x(n-1)}" cy="${y(d.tot[n-1])}" r="4.5" fill="var(--c3)" stroke="var(--surface)" stroke-width="2"/>`;
  const every=Math.ceil((n-1)/8);
  for(let i=0;i<n;i++){if(i%every===0||i===n-1)s+=`<text x="${x(i)}" y="${H-6}" text-anchor="middle">${i?i+'a':'hoje'}</text>`;
    const w=(W-pl-pr)/(n-1);s+=`<rect class="hit" data-i="${i}" x="${x(i)-w/2}" y="0" width="${w}" height="${H}"/>`}
  el.innerHTML=s+'</svg><div class="ctip" hidden></div>';
}
function chartTip(el,i,evt){
  const d=CH[el.dataset.chart],tip=el.querySelector('.ctip');if(!tip)return;
  let html='';
  if(d.type==='growth')html=`<b>${i?`Depois de ${i} ano${i>1?'s':''}`:'Hoje'}</b><div style="--c:var(--c1)"><i></i>Aportado<em>${money0(d.ap[i])}</em></div><div style="--c:var(--c3)"><i></i>Rendimento<em>${money0(d.tot[i]-d.ap[i])}</em></div><div><i style="background:transparent"></i>Total<em>${money0(d.tot[i])}</em></div>`;
  else if(d.type==='bars'){html=`<b>${ymLong(d.labels[i])}</b>`+d.series.map(se=>{const v=se.v[i];return `<div style="--c:${se.signed?(v<0?'var(--c8)':'var(--c1)'):`var(--c${se.c})`}"><i></i>${esc(se.n)}<em>${money(v)}</em></div>`}).join('');}
  else{const x=d.items[i],tot=sum(d.items,z=>z.v);html=`<b>${esc(x.n)}</b><div style="--c:var(--c${x.c})"><i></i>${(x.v/tot*100).toFixed(1)}%<em>${money(x.v)}</em></div>`}
  tip.innerHTML=html;tip.hidden=false;
  const r=el.getBoundingClientRect(),tw=tip.offsetWidth;let x=evt.clientX-r.left+14;if(x+tw>r.width)x=evt.clientX-r.left-tw-14;if(x<0)x=0;
  tip.style.left=x+'px';tip.style.top=Math.max(0,evt.clientY-r.top-tip.offsetHeight-10)+'px';
}
document.addEventListener('pointermove',e=>{
  const t=e.target;const el=t.closest&&t.closest('.chart[data-chart]');
  document.querySelectorAll('.ctip').forEach(x=>{if(!el||!el.contains(x))x.hidden=true});

  if(t.classList.contains('hit'))chartTip(el,+t.dataset.i,e);
  else if(t.dataset&&t.dataset.di!=null)chartTip(el,+t.dataset.di,e);
  else{const tp=el.querySelector('.ctip');if(tp)tp.hidden=true}

    tpl.forEach(([c,n,base,varr],j)=>{const times=c==='alim'&&j<3?(j===0?3:2):(rnd()<.55?1:0);for(let t=0;t<times;t++){if(ym===now&&rnd()>lastDay/30)continue;m.expenses.push({id:uid(),catId:c,note:n,amount:Math.round((base+(rnd()-.4)*varr)*100)/100,date:`${ym}-${pad(1+Math.floor(rnd()*lastDay))}`})}});
    if(i%4===2)m.extras.push({id:uid(),name:'Freela',amount:1200+Math.round(rnd()*800)});
    if(ym.endsWith('-12'))m.extras.push({id:uid(),name:'13º salário',amount:7800});
    cfg.bills.forEach(b=>{if(active(b,ym)&&(ym<now||b.day<new Date().getDate()))m.paid[b.id]=true});
    invs.forEach(v=>{if(rnd()<.8)v.moves.push({id:uid(),date:`${ym}-${pad(5+Math.floor(rnd()*10))}`,amount:Math.round(v.m*(.7+rnd()*.6))})});
    months[ym]=m;}
  cfg.investments=invs.map(({m,...v})=>{const ap=sum(v.moves);const r={acoes:1.12,fii:1.06,cripto:1.35,cdb:1.07,tesouro:1.065}[v.type]||1.05;return {...v,current:Math.round(ap*r*100)/100}});
  return {cfg,months};
}
const arm=new WeakMap();

  pickYM:v=>{S.ym=v;render()},
  close:closeSheet,
  addExp:()=>sheetExp(),editExp:sheetExp,

  addIncome:()=>sheetIncome(),editIncome:sheetIncome,

  investIn:v=>{const [pid,type,amt]=v.split('|');const iv=S.cfg.investments.find(z=>z.projectId===pid&&z.type===type);if(iv)sheetMove(iv.id,1,+amt||null);else sheetInv(null,{type,projectId:pid,amount:+amt||null})},
  nf:v=>{const c=S.cfg;let f=[...(c.notifFilter||[])];if(!v)f=[];else f=f.includes(v)?f.filter(x=>x!==v):[...f,v];if(f.length===NTYPES.length)f=[];c.notifFilter=f;save('cfg')},
  dis:v=>{const c=S.cfg;c.dismissed??={};const lim=Date.now()-150*864e5;for(const k in c.dismissed)if(c.dismissed[k]<lim)delete c.dismissed[k];c.dismissed[v]=Date.now();save('cfg')},
  undis:v=>{if(S.cfg.dismissed)delete S.cfg.dismissed[v];save('cfg')},
  showDis:()=>{S.showDis=!S.showDis;render()},
  move:v=>{const [id,s]=v.split(':');sheetMove(id,+s)},
  pview:v=>{S.cfg.projView=v;save('cfg')},
  bview:v=>{S.cfg.billView=v;save('cfg')},
  kcol:v=>{const [kb,c]=v.split('|');S.kcol[kb]=c;render()},
  kadv:v=>{const [kb,id]=v.split('|');kAdvance(kb,id)},
  kmenu:v=>sheetKMenu(v),
  kto:v=>{const [id,c]=v.split('|');closeSheet();kMove('proj',id,c)},
  kopen:v=>sheetKOpen(v),
  kstack:()=>{S.kOpen=!S.kOpen;render()},
  undo:kUndo,
  setPw:()=>sheetSetPw(),changePw:()=>sheetChangePw(false),removePw:()=>sheetChangePw(true),lockNow:()=>lockNow(),
  forgotPw:(v,b)=>{b.dataset.ico='trash';if(!armed(b))return;try{localStorage.removeItem(LS_KEY)}catch(e){}location.reload()},
  setValue:sheetValue,
  paid:v=>{const m=ensureMonth(S.ym);if(m.paid[v])delete m.paid[v];else m.paid[v]=true;save(S.ym)},
  carry:()=>{S.cfg.carry=!S.cfg.carry;save('cfg')},
  delExp:(v,b)=>{if(!armed(b))return;for(const [ym,m] of Object.entries(S.months)){if((m.expenses||[]).some(x=>x.id===v)){m.expenses=m.expenses.filter(x=>x.id!==v);closeSheet();save(ym);toast('Gasto apagado');return}}},
  delExtra:(v,b)=>{if(!armed(b))return;const m=ensureMonth(S.ym);m.extras=m.extras.filter(x=>x.id!==v);closeSheet();save(S.ym)},
  endFixed:(v,b)=>{if(!armed(b))return;const [k,id]=v.split(':');const list=k==='inc'?S.cfg.incomes:S.cfg.bills;const x=list.find(z=>z.id===id);if(!x)return;
    const prev=ymAdd(S.ym,-1);if(x.start>prev){list.splice(list.indexOf(x),1);toast('Removida')}else{x.end=prev;toast('Encerrada a partir de '+ymLabel(S.ym).toLowerCase())}closeSheet();save('cfg')},
  delCat:(v,b)=>{if(!armed(b))return;S.cfg.categories=S.cfg.categories.filter(c=>c.id!==v);const keys=['cfg'];S.cfg.bills.forEach(x=>{if(x.catId===v)x.catId='outros'});
    for(const [ym,m] of Object.entries(S.months)){let ch=false;(m.expenses||[]).forEach(e=>{if(e.catId===v){e.catId='outros';ch=true}});if(ch)keys.push(ym)}closeSheet();save(...keys);toast('Gastos movidos para Outros')},
  delProject:(v,b)=>{if(!armed(b))return;S.cfg.projects=S.cfg.projects.filter(p=>p.id!==v);S.cfg.investments.forEach(x=>{if(x.projectId===v)x.projectId=null});closeSheet();save('cfg')},
  delInv:(v,b)=>{if(!armed(b))return;S.cfg.investments=S.cfg.investments.filter(x=>x.id!==v);closeSheet();save('cfg');toast('Investimento apagado')},
  delMove:(v,b)=>{b.dataset.ico='x';if(!armed(b))return;const [id,mid]=v.split(':');const iv=S.cfg.investments.find(z=>z.id===id);const mv=iv.moves.find(m=>m.id===mid);iv.moves=iv.moves.filter(m=>m.id!==mid);iv.current=Math.max(0,(iv.current||0)-mv.amount);save('cfg');sheetInvDetail(id)},
  demo:(v,b)=>{const hasData=S.cfg.incomes.length||S.cfg.bills.length||Object.keys(S.months).length;if(hasData&&!S.cfg.demo){b.dataset.ico='flask';if(!armed(b))return}const d=demoData();S.ym=thisYM();replaceAll(d.cfg,d.months);toast('Exemplo carregado')},
  clearAll:(v,b)=>{b.dataset.ico=S.cfg.demo&&S.tab==='home'?'reset':'trash';if(!armed(b))return;const keep=S.cfg.categories;const c=newCfg();if(!S.cfg.demo)c.categories=keep;replaceAll(c,{});toast('Tudo limpo')},
  export:async()=>{const head={app:'caixa-mensal',v:1,exported:new Date().toISOString()};
    const txt=LOCK.key?JSON.stringify({...head,...await seal(JSON.stringify({cfg:S.cfg,months:S.months}))}):JSON.stringify({...head,cfg:S.cfg,months:S.months},null,1);
    let dl=null;try{dl=window.claude&&await claude.use('downloads')}catch(e){}
    const fname=`invext-backup-${todayISO()}.json`;
    if(dl){try{await dl.save({filename:fname,data:txt});S.cfg.lastBackup=Date.now();markDirty('cfg');toast('Cópia salva');return}catch(e){if(e&&e.code==='declined')return}}
    if(!window.claude){ // standalone app: share sheet on phones, normal download on PC
      try{const file=new File([txt],fname,{type:'application/json'});
        if(navigator.canShare&&navigator.canShare({files:[file]})&&matchMedia('(pointer:coarse)').matches){await navigator.share({files:[file],title:'Backup Invext'});S.cfg.lastBackup=Date.now();save('cfg');return}
        const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=fname;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);S.cfg.lastBackup=Date.now();save('cfg');toast('Cópia salva em Downloads');return}
      catch(e){if(e&&e.name==='AbortError')return}}
    sheetExportText(txt)},
  copyJson:()=>{const t=$('#f_json');navigator.clipboard.writeText(t.value).then(()=>toast('Copiado'),()=>{t.select();toast('Selecionado: use Ctrl+C')})},
  import:()=>sheetImport(),
  doImport:()=>{try{const d=JSON.parse($('#f_json').value);if(d.enc===ENC_TAG){if(!canCrypt())throw 0;sheetImportPw(d);return}if(!d.cfg||!d.cfg.categories)throw 0;d.cfg.demo=false;replaceAll(d.cfg,d.months||{});closeSheet();toast('Dados importados')}catch(e){toast('Arquivo inválido: use uma cópia exportada por este app')}},
};

/* ---------- tooltips: hover on PC, long-press on phone ---------- */
const tipEl=$('#tip');let tipT=null,lpT=null,suppressClick=false,lpStart=null;
function showTip(el){const t=el.dataset.tip;if(!t)return;tipEl.textContent=t;tipEl.hidden=false;const r=el.getBoundingClientRect();const below=r.top<48;tipEl.classList.toggle('below',below);
  let x=r.left+r.width/2;const w=tipEl.offsetWidth;x=Math.min(window.innerWidth-w/2-8,Math.max(w/2+8,x));tipEl.style.left=x+'px';tipEl.style.top=(below?r.bottom:r.top)+'px'}
function hideTip(){clearTimeout(tipT);tipEl.hidden=true}
document.addEventListener('pointerover',e=>{if(e.pointerType!=='mouse')return;const el=e.target.closest('[data-tip]');clearTimeout(tipT);if(!el){tipEl.hidden=true;return}tipT=setTimeout(()=>showTip(el),280)});
document.addEventListener('pointerout',e=>{if(e.pointerType!=='mouse')return;const el=e.target.closest('[data-tip]');if(el&&!el.contains(e.relatedTarget))hideTip()});
document.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse')return;const el=e.target.closest('[data-tip]');if(!el)return;lpStart=[e.clientX,e.clientY];clearTimeout(lpT);
  lpT=setTimeout(()=>{showTip(el);suppressClick=true;if(navigator.vibrate)try{navigator.vibrate(8)}catch(_){}},450)});
const endLP=()=>{clearTimeout(lpT);if(!tipEl.hidden&&suppressClick)setTimeout(hideTip,1400);setTimeout(()=>{suppressClick=false},400)};
document.addEventListener('pointerup',endLP);document.addEventListener('pointercancel',endLP);
document.addEventListener('pointermove',e=>{if(lpStart&&e.pointerType!=='mouse'&&Math.hypot(e.clientX-lpStart[0],e.clientY-lpStart[1])>10){clearTimeout(lpT);lpStart=null}});
document.addEventListener('contextmenu',e=>{if(e.target.closest('[data-tip]'))e.preventDefault()});
window.addEventListener('scroll',hideTip,{passive:true});

let toastT=null;function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{el.hidden=true},2200)}
function toastUndo(t){const el=$('#toast');el.innerHTML=`<span>${esc(t)}</span><button data-act="undo">Desfazer</button>`;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{el.hidden=true;LAST=null},5000)}

/* ---------- kanban drag: mouse drags right away, touch holds 250 ms (or swipes right to advance) ---------- */
let KD=null;
function kTarget(x,y,kb){const t=document.elementFromPoint(x,y)?.closest('[data-drop]');return t&&t.dataset.kb===kb?t:null}
function kClear(){document.querySelectorAll('.over').forEach(n=>n.classList.remove('over'))}
function kStart(){
  const k=KD,r=k.el.getBoundingClientRect();k.mode='drag';k.ox=k.x0-r.left;k.oy=k.y0-r.top;
  const g=k.el.cloneNode(true);g.classList.add('kghost');g.removeAttribute('data-act');g.style.width=r.width+'px';g.style.left=r.left+'px';g.style.top=r.top+'px';
  document.body.appendChild(g);k.ghost=g;k.el.classList.add('lifted');document.body.classList.add('dragging');hideTip();clearTimeout(lpT);
  if(navigator.vibrate)try{navigator.vibrate(10)}catch(_){}
}
function kStop(){const k=KD;KD=null;if(!k)return null;clearTimeout(k.timer);clearInterval(k.scroll);
  if(k.ghost)k.ghost.remove();k.el.classList.remove('lifted','swipe','go');k.el.style.transform='';document.body.classList.remove('dragging');kClear();return k}
document.addEventListener('pointerdown',e=>{
  if(e.button>0||KD)return;const el=e.target.closest('.kc');if(!el||el.classList.contains('kghost')||e.target.closest('button,a,input,select,textarea'))return;
  KD={el,kb:el.dataset.kb,id:el.dataset.id,from:el.dataset.col,x0:e.clientX,y0:e.clientY,mode:'wait',touch:e.pointerType!=='mouse',pid:e.pointerId};
  if(KD.touch)KD.timer=setTimeout(()=>{if(KD&&KD.mode==='wait')kStart()},250);
});
document.addEventListener('pointermove',e=>{
  const k=KD;if(!k||e.pointerId!==k.pid)return;const dx=e.clientX-k.x0,dy=e.clientY-k.y0;
  if(k.mode==='wait'){
    if(!k.touch){if(Math.hypot(dx,dy)<6)return;kStart()}
    else if(dx>12&&dx>Math.abs(dy)*1.5){clearTimeout(k.timer);k.mode='swipe';k.el.classList.add('swipe')}
    else{if(Math.hypot(dx,dy)>10){clearTimeout(k.timer);KD=null}return}
  }
  if(k.mode==='swipe'){const t=Math.max(0,Math.min(130,dx));k.el.style.transform=`translateX(${t}px)`;k.el.classList.toggle('go',t>85);return}
  k.ghost.style.left=(e.clientX-k.ox)+'px';k.ghost.style.top=(e.clientY-k.oy)+'px';
  const t=kTarget(e.clientX,e.clientY,k.kb);if(t!==k.over){kClear();if(t&&t.dataset.drop!==k.from)t.classList.add('over');k.over=t}
  clearInterval(k.scroll);const edge=e.clientY<70?-1:e.clientY>innerHeight-110?1:0;if(edge)k.scroll=setInterval(()=>scrollBy(0,edge*12),16);
});
document.addEventListener('pointerup',e=>{
  if(!KD||e.pointerId!==KD.pid)return;const mode=KD.mode,t=mode==='drag'?kTarget(e.clientX,e.clientY,KD.kb):null,go=KD.el.classList.contains('go');const k=kStop();
  if(mode==='drag'){suppressClick=true;if(t&&t.dataset.drop!==k.from)kMove(k.kb,k.id,t.dataset.drop)}
  else if(mode==='swipe'){suppressClick=true;if(go)kAdvance(k.kb,k.id)}
});
document.addEventListener('pointercancel',e=>{if(KD&&e.pointerId===KD.pid)kStop()});
document.addEventListener('touchmove',e=>{if(KD&&KD.mode!=='wait')e.preventDefault()},{passive:false});
document.addEventListener('contextmenu',e=>{if(e.target.closest('.kc'))e.preventDefault()});
document.addEventListener('keydown',e=>{const el=e.target.closest?.('.kc');if(!el||e.target!==el)return;
  if(e.key==='Enter'||e.key===' '){e.preventDefault();el.click()}
  else if(e.key==='ArrowRight'&&el.dataset.col!=='done'){e.preventDefault();kAdvance(el.dataset.kb,el.dataset.id)}});
let rzT=null;window.addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(drawCharts,120)});

const BOOT_AT=Date.now();let splashGone=false;
function hideSplash(){if(splashGone)return;splashGone=true;const wait=Math.max(0,(matchMedia('(prefers-reduced-motion: reduce)').matches?1500:3000)-(Date.now()-BOOT_AT));
  const go=()=>{const s=$('#splash');if(!s||s.classList.contains('out'))return;s.classList.add('out');setTimeout(()=>s.remove(),500)};
  const t=setTimeout(go,wait);$('#splash')?.addEventListener('click',()=>{clearTimeout(t);go()})}
boot();
